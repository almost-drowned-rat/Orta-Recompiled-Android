# Seeds - only from this port's own analysis of the PAL default.xbe and its own runs (2026-11-04). The 678 seeds
# carried over from another project's US list were removed (maintainer: that list has no declared licence -
# "unclear = reference only"). Without them 247 table-reached entries merged into their neighbours and the game
# crashed at boot; the scan below finds 286 entries from the binary alone (lift 2026-11-04 lift_ownseeds3: 18,715
# functions, 0 failed; regress, the light-dragon replay and level 2 run clean).
#   A  code immediates: an imm32 of `mov r/m32, imm32` / `mov r32, imm32` / `push imm32` in a code section that
#      points at a 16-byte aligned address in a code section, preceded by padding (90/CC) or a ret, whose first
#      byte is not padding or zero, and that is not a lifted function yet (callbacks and vtables built in code).
#   B  .text addresses on a 16-byte boundary right after a ret / ret n / jmp followed by padding (the compiler's
#      function alignment), not a lifted function yet, first byte not padding or zero (beyond A).
#   C  a pointer in .rdata to such an entry (beyond A and B).
#   E  the target of a direct jmp/call rel32 inside a lifted function that lies outside it and is no function yet
#      (0x104B00 from 0x295C0, 0x3034F4 from the XPP thunk 0x3041CF).
#   Excluded: a B candidate whose first 12 instructions hold one a compiler never emits at a function start
#   (iretd, int n, ljmp/lcall, retf, daa/das, arpl, bound, in/out/ins, hlt, cli/sti, push cs, ...) or that decodes to
#   fewer than 3 instructions - data after a function (15 removed, run 20261104_171846: data lifted as code).
#   Excluded: any candidate that is an entry of an inline switch table in .text (a run of >= 3 consecutive .text
#   pointers) - those are case labels: 0x290560 and 0x2906F0 (memcpy's tail table at 0x2906D8) split memcpy and
#   made its indirect jmp an unresolvable ICALL (run 20261104_170959).
#   observed: ICALL targets reached in this port's runs (ICALL feedback); every other target our runs reached
#      (1,891 in 351 runs) is a lifted function already or in A.
