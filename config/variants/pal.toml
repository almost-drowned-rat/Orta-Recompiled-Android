# ── Instruction hooks (toolkit tools/recomp/hooks_config.py; a change needs a re-lift) ─────────────────────────
# D3D 5028 write-combine flush acknowledge (as THPS 2X config/hooks.toml, M3.5): CDevice_KickOff (sub_002AFD90)
# and its siblings sub_002AFD30 / sub_002AFE70 set bit 16 of NV2A 0x00100410 and spin ("test [eax+0x100410],
# 0x10000 / jne") until the GPU clears it. On the host only the toolkit's flag thread cleared it, every
# RECOMP_NV2A_POLL_US (200 us), so every kickoff spun up to 200 us: a gameplay profile (run
# 20261103_214459_B_prof1, attract demo ~155 s) had the main thread 97 % busy, 331 of 400 samples in KickOff.
# recomp_spin_wake() (the runtime's flush acknowledge) right before the test ends the spin at once. The hook sits
# at the loop head (the test instruction itself); no flag is live there (the test sets them).
[[hook]]
at = 0x002AFD50
call = "recomp_spin_wake"

[[hook]]
at = 0x002AFDD0
call = "recomp_spin_wake"

[[hook]]
at = 0x002AFEB0
call = "recomp_spin_wake"

# Movie-start race forcing test (2026-11-04): in the Sofdec decoder sub_002F9620, right after the call
# to sub_0023E2A0 returns and before "call [[esi]+0x20]" at 0x2F9CC5 (the crash site of
# ref_port_20261103_192903\orta_crash.log; esi = [esp+0x40] = 0x4BE4A0 there). orta_race_sofdec_delay() sleeps
# ORTA_RACE_SOFDEC_MS (off by default) to widen the window; A/B with ORTA_CRI_LOCK=0. No flag is live here.
[[hook]]
at = 0x002F9CBB
call = "orta_race_sofdec_delay"

# Options screen open (sub_000AF410): right after its sprite load sub_001B7930 returns, before sub_001C0F40 /
# sub_0002A980 (relabel + views, recomp_manual.c orta_opt_after_load). First try at 0x0AF4FA landed in
# sub_000AF4E0, which did not run when OPTIONEN opened (run 20261104_050039_opt_compact2). Flags dead: next is push 2.
[[hook]]
at = 0x000AF4BD
call = "orta_opt_after_load"
